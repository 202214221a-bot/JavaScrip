<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>

    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="contenedor">

        <h1>1. Suma de dos números</h1>

        <p>
            La suma de 15 + 8 es:
        </p>

        <p id="resultado"></p>

        <script>

            let num1 = 15;

            let num2 = 8;

            let suma = num1 + num2;

            document.getElementById("resultado").innerHTML =
            suma;

        </script>

        <a href="index.html">

            <button>
                Volver al menú
            </button>

        </a>

    </div>

</body>
</html>
